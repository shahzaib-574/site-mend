name: Feature
description: Propose one focused SiteMend user outcome
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What is difficult today, and for whom?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the smallest valuable behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable pass/fail conditions.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and trust boundaries
      description: Security, privacy, accessibility, performance, and failure risks.
    validations:
      required: true
